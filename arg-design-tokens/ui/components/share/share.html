<section id="share">
        <h2>Share bar</h2>
        <p class="sec-desc">Thanh tỷ lệ nhiều phần theo màu giao dịch. Mặc định cao 20px có chữ bên trong; --thin cao 6px, nhãn ở dưới.</p>
        <div class="demo">
          <div class="group"><h3>Tổng điểm kéo lên, kéo xuống</h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><div class="arg-share" role="img" aria-label="Tổng điểm kéo lên +7,05, kéo xuống -3,46, thay đổi +3,59 điểm"><div class="arg-share__bar"><span class="arg-share__seg arg-share__seg--up" style="--w:67.1">+7,05</span><span class="arg-share__seg arg-share__seg--down" style="--w:32.9">-3,46</span></div></div></div></div>
          <div class="group"><h3>Số mã giảm, đứng, tăng (--thin)</h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><div class="arg-share arg-share--thin" role="img" aria-label="89 mã giảm, 63 mã đứng, 187 mã tăng"><div class="arg-share__bar"><span class="arg-share__seg arg-share__seg--down" style="--w:26.3"></span><span class="arg-share__seg arg-share__seg--ref" style="--w:18.6"></span><span class="arg-share__seg arg-share__seg--up" style="--w:55.2"></span></div><ul class="arg-share__legend"><li class="arg-down">Giảm: 89</li><li class="arg-ref">Đứng: 63</li><li class="arg-up">Tăng: 187</li></ul></div></div></div>
        </div>
      </section>
