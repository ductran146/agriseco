<section id="dropdown">
        <h2>Dropdowns</h2>
        <p class="sec-desc">Menu thả xuống. Mở bằng chuột hoặc phím Enter, duyệt bằng mũi tên, đóng bằng Esc hoặc bấm ra ngoài.</p>
        <div class="demo" style="min-height:360px;align-content:start">
          <div class="row row--top">
            <div class="arg-dropdown" data-arg-dropdown>
              <button class="arg-btn arg-btn--primary" type="button" aria-haspopup="menu" aria-expanded="false">Hành động<i data-arg-icon="caret-down"></i></button>
              <div class="arg-menu" role="menu" hidden>
                <div class="arg-menu__label">Lệnh</div>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="plus"></i>Đặt lệnh mới</button>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="pencil-simple"></i>Sửa lệnh</button>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="copy"></i>Nhân bản</button>
                <div class="arg-menu__sep"></div>
                <button class="arg-menu__item arg-menu__item--danger" role="menuitem" type="button"><i data-arg-icon="trash"></i>Huỷ lệnh</button>
              </div>
            </div>
            <div class="arg-dropdown" data-arg-dropdown>
              <button class="arg-btn arg-btn--outline" type="button" aria-haspopup="menu" aria-expanded="false"><i data-arg-icon="funnel"></i>Bộ lọc<i data-arg-icon="caret-down"></i></button>
              <div class="arg-menu" role="menu" hidden>
                <button class="arg-menu__item" role="menuitemradio" aria-checked="true" type="button">Tất cả<i data-arg-icon="check" class="end"></i></button>
                <button class="arg-menu__item" role="menuitemradio" aria-checked="false" type="button">Đã khớp<i data-arg-icon="check" class="end" style="visibility:hidden"></i></button>
                <button class="arg-menu__item" role="menuitemradio" aria-checked="false" type="button">Chờ khớp<i data-arg-icon="check" class="end" style="visibility:hidden"></i></button>
              </div>
            </div>
            <div class="arg-dropdown" data-arg-dropdown>
              <button class="arg-btn arg-btn--tertiary arg-btn--icon" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Thêm tuỳ chọn"><i data-arg-icon="dots-three-vertical"></i></button>
              <div class="arg-menu arg-menu--end" role="menu" hidden>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="download-simple"></i>Tải xuống</button>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="share-network"></i>Chia sẻ</button>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="bookmark-simple"></i>Lưu</button>
              </div>
            </div>
            <div class="arg-dropdown" data-arg-dropdown style="margin-left:auto">
              <button class="arg-btn arg-btn--text-strong" type="button" aria-haspopup="menu" aria-expanded="false"><span class="arg-avatar arg-avatar--xs">AN</span>Nguyễn Văn An<i data-arg-icon="caret-down"></i></button>
              <div class="arg-menu arg-menu--end" role="menu" hidden>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="user"></i>Hồ sơ</button>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="gear"></i>Cài đặt</button>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="question"></i>Trợ giúp</button>
                <div class="arg-menu__sep"></div>
                <button class="arg-menu__item" role="menuitem" type="button"><i data-arg-icon="sign-out"></i>Đăng xuất</button>
              </div>
            </div>
          </div>
        </div>
      </section>
