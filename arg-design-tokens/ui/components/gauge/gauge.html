<section id="gauge">
        <h2>Gauge</h2>
        <p class="sec-desc">Đồng hồ tín hiệu kỹ thuật: kim chỉ kết luận từ Bán mạnh đến Mua mạnh, kèm số chỉ báo Bán, Trung lập, Mua.</p>
        <div class="demo">
          <div class="group"><h3>Bán mạnh</h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><div class="arg-gauge" style="--v:0.217"><svg class="arg-gauge__dial" viewBox="0 0 320 160" role="img" aria-label="Tín hiệu bán mạnh: 15 bán, 6 trung lập, 2 mua"><path class="zone z1" d="M 70 140 A 90 90 0 0 1 250 140" pathLength="100" stroke-dasharray="19.2 100" stroke-dashoffset="-0.4"/><path class="zone z2" d="M 70 140 A 90 90 0 0 1 250 140" pathLength="100" stroke-dasharray="19.2 100" stroke-dashoffset="-20.4"/><path class="zone z3" d="M 70 140 A 90 90 0 0 1 250 140" pathLength="100" stroke-dasharray="19.2 100" stroke-dashoffset="-40.4"/><path class="zone z4" d="M 70 140 A 90 90 0 0 1 250 140" pathLength="100" stroke-dasharray="19.2 100" stroke-dashoffset="-60.4"/><path class="zone z5" d="M 70 140 A 90 90 0 0 1 250 140" pathLength="100" stroke-dasharray="19.2 100" stroke-dashoffset="-80.4"/><text x="53.5" y="105.4" text-anchor="end" dominant-baseline="middle">Bán mạnh</text><text x="94.2" y="49.4" text-anchor="end" dominant-baseline="middle">Bán</text><text x="160.0" y="28.0" text-anchor="middle" dominant-baseline="middle">Trung lập</text><text x="225.8" y="49.4" text-anchor="start" dominant-baseline="middle">Mua</text><text x="266.5" y="105.4" text-anchor="start" dominant-baseline="middle">Mua mạnh</text><g class="arg-gauge__needle"><line x1="160" y1="140" x2="160" y2="66"/><circle cx="160" cy="140" r="5"/></g></svg><b class="arg-gauge__verdict arg-sell">BÁN MẠNH</b><dl class="arg-gauge__counts"><div><dt>Bán</dt><dd class="arg-sell">15</dd></div><div><dt>Trung lập</dt><dd>6</dd></div><div><dt>Mua</dt><dd class="arg-buy">2</dd></div></dl></div></div></div>
          <div class="group"><h3>Trung lập</h3>
