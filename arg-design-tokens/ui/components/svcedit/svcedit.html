<section id="svcedit">
        <h2>Svcedit</h2>
        <p class="sec-desc">Màn Tuỳ chỉnh dịch vụ nhanh: lưới thẻ đã chọn (nút bỏ đỏ, kéo đổi vị trí) và danh sách dịch vụ theo nhóm với nút thêm. Dịch vụ đã chọn không hiện nút thêm.</p>
        <div class="demo">
          <div class="group"><h3>Thẻ đã chọn</h3>
            <div class="phone" style="padding:var(--arg-space-4x) var(--arg-gutter)"><ul class="arg-svcedit__grid">
              <li class="arg-svcedit__tile"><button class="arg-svcedit__remove" type="button" aria-label="Bỏ Sổ lệnh"><i data-arg-icon="minus"></i></button><span class="arg-service__icon"><i data-arg-icon="clipboard-list-duotone"></i></span><span class="arg-service__label">Sổ lệnh</span></li>
              <li class="arg-svcedit__tile"><button class="arg-svcedit__remove" type="button" aria-label="Bỏ Nộp tiền"><i data-arg-icon="minus"></i></button><span class="arg-service__icon"><i data-arg-icon="card-receive-duotone"></i></span><span class="arg-service__label">Nộp tiền</span></li>
              <li class="arg-svcedit__tile"><button class="arg-svcedit__remove" type="button" aria-label="Bỏ Chuyển khoản"><i data-arg-icon="minus"></i></button><span class="arg-service__icon"><i data-arg-icon="transfer-horizontal-duotone"></i></span><span class="arg-service__label">Chuyển khoản</span></li>
            </ul></div></div>
          <div class="group"><h3>Danh sách theo nhóm</h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><ul class="arg-svcedit__list">
              <li class="arg-svcedit__row"><span class="arg-svcedit__icon"><i data-arg-icon="clipboard-list-duotone"></i></span><span class="arg-svcedit__name">Sổ lệnh</span></li>
              <li class="arg-svcedit__row"><span class="arg-svcedit__icon"><i data-arg-icon="document-text-duotone"></i></span><span class="arg-svcedit__name">Lịch sử lệnh</span><button class="arg-svcedit__add" type="button" aria-label="Thêm Lịch sử lệnh"><i data-arg-icon="plus-circle"></i></button></li>
              <li class="arg-svcedit__row"><span class="arg-svcedit__icon"><i data-arg-icon="notes-duotone"></i></span><span class="arg-svcedit__name">Lệnh điều kiện</span><button class="arg-svcedit__add" type="button" aria-label="Thêm Lệnh điều kiện" disabled><i data-arg-icon="plus-circle"></i></button></li>
            </ul></div></div>
        </div>
      </section>
