<section id="embed">
        <h2>Embed Video</h2>
        <p class="sec-desc">Khung tỉ lệ cố định cho video hoặc iframe: <code>.arg-ratio--21x9 | 16x9 | 4x3 | 1x1</code>. Trang này chặn nhúng bên ngoài nên dùng khung mô phỏng; khi triển khai thật, đặt <code>&lt;iframe&gt;</code> hoặc <code>&lt;video&gt;</code> trực tiếp vào <code>.arg-ratio</code>.</p>
        <div class="demo">
          <div class="cols cols--lg">
            <div class="group"><h3>16 : 9</h3>
              <div class="arg-ratio arg-ratio--16x9"><div class="arg-ratio__inner arg-video"><button class="arg-video__play" type="button" aria-label="Phát video"><i data-arg-icon="play"></i></button><div class="arg-video__bar"><span>00:00</span><div class="arg-progress"><div class="arg-progress__bar" style="--v:0%;background:#fff"></div></div><span>03:24</span></div></div></div></div>
            <div class="group"><h3>4 : 3</h3>
              <div class="arg-ratio arg-ratio--4x3"><div class="arg-ratio__inner arg-video"><button class="arg-video__play" type="button" aria-label="Phát video"><i data-arg-icon="play"></i></button></div></div></div>
            <div class="group"><h3>21 : 9</h3>
              <div class="arg-ratio arg-ratio--21x9"><div class="arg-ratio__inner arg-video"><button class="arg-video__play" type="button" aria-label="Phát video" style="width:48px;height:48px"><i data-arg-icon="play" style="width:20px;height:20px"></i></button></div></div></div>
            <div class="group"><h3>1 : 1</h3>
              <div class="arg-ratio arg-ratio--1x1" style="max-width:260px"><div class="arg-ratio__inner arg-video"><button class="arg-video__play" type="button" aria-label="Phát video"><i data-arg-icon="play"></i></button></div></div></div>
          </div>
        </div>
      </section>
