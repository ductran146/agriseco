<section id="stepper">
        <h2>Stepper</h2>
        <p class="sec-desc">Ô nhập số có nhãn bên trái và nút trừ, cộng hai bên (giá, khối lượng). Dùng nền <code>.arg-control</code> nên cao 40px, bo theo tỷ lệ. Mỗi lần bấm cộng hoặc trừ theo <code>data-step</code>, số lẻ theo <code>data-dec</code>. Trong form <code>[data-arg-order]</code>, giá trị ước tính tự cập nhật.</p>
        <div class="demo">
          <div class="group"><h3>Giá và khối lượng</h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><div style="display:grid;gap:12px;max-width:219px"><div class="arg-control arg-stepper" data-step="0.1" data-dec="2" data-arg-field="price"><span class="arg-control__label">Giá</span><button class="arg-icon-btn" type="button" data-arg-step="-1" aria-label="Giảm giá"><i data-arg-icon="minus"></i></button><input class="arg-input" inputmode="decimal" aria-label="Giá" value="91,80"><button class="arg-icon-btn" type="button" data-arg-step="1" aria-label="Tăng giá"><i data-arg-icon="plus"></i></button></div><div class="arg-control arg-stepper" data-step="100" data-dec="0" data-arg-field="qty"><span class="arg-control__label">Khối lượng</span><button class="arg-icon-btn" type="button" data-arg-step="-1" aria-label="Giảm khối lượng"><i data-arg-icon="minus"></i></button><input class="arg-input" inputmode="decimal" aria-label="Khối lượng" value="100"><button class="arg-icon-btn" type="button" data-arg-step="1" aria-label="Tăng khối lượng"><i data-arg-icon="plus"></i></button></div><div class="arg-control arg-select arg-select--center"><span class="arg-control__label">Loại lệnh</span><select class="arg-select-native" aria-label="Loại lệnh"><option>LO</option><option>MP</option><option>ATO</option><option>ATC</option></select><i data-arg-icon="caret-down"></i></div></div></div></div>
        </div>
      </section>
