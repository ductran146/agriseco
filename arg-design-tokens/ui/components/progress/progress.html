<section id="progress">
        <h2>Progress</h2>
        <p class="sec-desc">Thanh tiến độ dùng gradient Agriseco, có biến thể xanh/đỏ giao dịch. Vòng tiến độ dùng SVG.</p>
        <div class="demo">
          <div class="cols">
            <div class="stack">
              <div class="arg-progress-row"><div class="arg-progress-row__top"><span>Khớp lệnh</span><span>68%</span></div><div class="arg-progress" role="progressbar" aria-label="Khớp lệnh" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100"><div class="arg-progress__bar" style="--v:68%"></div></div></div>
              <div class="arg-progress-row"><div class="arg-progress-row__top"><span>Sử dụng hạn mức margin</span><span>35%</span></div><div class="arg-progress arg-progress--sm" role="progressbar" aria-label="Hạn mức margin" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100"><div class="arg-progress__bar" style="--v:35%"></div></div></div>
              <div class="arg-progress-row"><div class="arg-progress-row__top"><span>Hoàn tất hồ sơ</span><span>82%</span></div><div class="arg-progress arg-progress--lg" role="progressbar" aria-label="Hoàn tất hồ sơ" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100"><div class="arg-progress__bar" style="--v:82%">82%</div></div></div>
              <div class="arg-progress-row"><div class="arg-progress-row__top"><span>Đang tải lên (động)</span><span id="stripe-v">45%</span></div><div class="arg-progress arg-progress--lg" role="progressbar" aria-label="Đang tải lên" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" id="stripe-pb"><div class="arg-progress__bar arg-progress__bar--striped" style="--v:45%"></div></div></div>
              <div class="row"><button class="arg-btn arg-btn--outline arg-btn--sm" type="button" data-arg-progress-step="#stripe-pb" data-arg-progress-label="#stripe-v" data-step="15"><i data-arg-icon="plus"></i>Tăng 15%</button></div>
            </div>
            <div class="stack">
              <div class="arg-progress-row"><div class="arg-progress-row__top"><span>Mua chủ động</span><span>57%</span></div><div class="arg-progress" role="progressbar" aria-label="Mua chủ động" aria-valuenow="57" aria-valuemin="0" aria-valuemax="100"><div class="arg-progress__bar arg-progress__bar--up" style="--v:57%"></div></div></div>
              <div class="arg-progress-row"><div class="arg-progress-row__top"><span>Bán chủ động</span><span>43%</span></div><div class="arg-progress" role="progressbar" aria-label="Bán chủ động" aria-valuenow="43" aria-valuemin="0" aria-valuemax="100"><div class="arg-progress__bar arg-progress__bar--down" style="--v:43%"></div></div></div>
              <div class="arg-progress-row"><div class="arg-progress-row__top"><span>Cung · Cầu</span><span>57 · 43</span></div><div class="arg-progress arg-progress--lg"><div class="arg-progress__bar arg-progress__bar--up" style="--v:57%;border-radius:0"></div><div class="arg-progress__bar arg-progress__bar--down" style="--v:43%;border-radius:0"></div></div></div>
              <div class="row" style="gap:var(--arg-space-6x)">
                <div class="arg-ring" style="--v:72"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.915" pathLength="100"/><circle class="fg" cx="18" cy="18" r="15.915" pathLength="100" stroke="var(--arg-p-brand-header-start)"/></svg><b>72%</b></div>
                <div class="arg-ring" style="--v:45"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.915" pathLength="100"/><circle class="fg" cx="18" cy="18" r="15.915" pathLength="100" stroke="var(--arg-trading-up-light-increase)"/></svg><b>45%</b></div>
                <div class="arg-ring" style="--v:20"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.915" pathLength="100"/><circle class="fg" cx="18" cy="18" r="15.915" pathLength="100" stroke="var(--arg-trading-down-light-increase)"/></svg><b>20%</b></div>
              </div>
            </div>
          </div>
        </div>
      </section>
