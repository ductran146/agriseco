<section id="side">
        <h2>Side toggle</h2>
        <p class="sec-desc">Công tắc chọn chiều lệnh Mua hoặc Bán. Mua dùng màu nút Mua, Bán dùng màu nút Bán (hai màu riêng). Khi dùng trong form <code>[data-arg-order]</code>, đổi chiều thì nút đặt lệnh đổi màu và nhãn theo.</p>
        <div class="demo">
          <div class="group"><h3>Mua · Bán</h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><div class="arg-side" role="group" aria-label="Chiều lệnh"><button class="arg-side__btn arg-side__btn--buy" type="button" aria-pressed="true">Mua</button><button class="arg-side__btn arg-side__btn--sell" type="button" aria-pressed="false">Bán</button></div></div></div>
          <div class="group"><h3>Màu chữ chiều lệnh .arg-buy, .arg-sell</h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><p style="margin:0"><b class="arg-buy">M</b> mua chủ động · <b class="arg-sell">B</b> bán chủ động</p></div></div>
        </div>
      </section>
