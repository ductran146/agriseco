<section id="image">
        <h2>Images</h2>
        <p class="sec-desc">Ảnh co giãn, bo góc, ảnh tròn, ảnh viền và avatar. Ảnh dưới đây là ảnh giữ chỗ vẽ bằng SVG.</p>
        <div class="demo">
          <div class="group"><h3>Kiểu ảnh</h3>
            <div class="row row--top">{{IMGROW}}</div></div>
          <div class="group"><h3>Avatar</h3>
            <div class="row">
              <span class="arg-avatar arg-avatar--xs">A</span><span class="arg-avatar arg-avatar--sm">AN</span><span class="arg-avatar">AN</span><span class="arg-avatar arg-avatar--lg">AN</span><span class="arg-avatar arg-avatar--xl">AN</span>
              <span class="arg-avatar arg-avatar--gray"><i data-arg-icon="user" class="i--20"></i></span><span class="arg-avatar arg-avatar--blue">TB</span><span class="arg-avatar arg-avatar--purple arg-avatar--square">LM</span>
              <span class="arg-avatar-group"><span class="arg-avatar arg-avatar--sm">AN</span><span class="arg-avatar arg-avatar--sm arg-avatar--blue">TB</span><span class="arg-avatar arg-avatar--sm arg-avatar--purple">LM</span><span class="arg-avatar arg-avatar--sm arg-avatar--gray">+4</span></span>
            </div></div>
          <div class="group"><h3>Logo</h3>
            <div class="row"><img class="arg-img" src="data:image/svg+xml;base64,__LOGO__" alt="Logo Agriseco" width="78" height="80"><div class="dim"><img class="arg-img" src="data:image/svg+xml;base64,__LOGO__" alt="Logo Agriseco trên nền tối" width="78" height="80"></div></div></div>
        </div>
      </section>
