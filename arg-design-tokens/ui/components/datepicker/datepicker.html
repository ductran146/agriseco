<section id="datepicker">
        <h2>Datepicker</h2>
        <p class="sec-desc">Ô chọn ngày: bấm ô thì bảng lịch trượt từ dưới lên. Ô "Đến ngày" bên dưới có giới hạn: không chọn được ngày trước "Từ ngày" và sau 30/11/2026.</p>
        <div class="demo">
          <div class="group"><h3>Ô chọn ngày <code>data-arg-datepicker</code></h3>
            <div class="phone arg-page" data-arg-today="2026-10-29" style="min-height:0;padding:var(--arg-space-3x) var(--arg-gutter)"><div class="arg-stack">
              <div class="arg-field"><label class="arg-label" for="dp1">Từ ngày</label><div class="arg-control arg-datepicker__field"><input class="arg-input" id="dp1" type="text" value="26/10/2026" data-iso="2026-10-26" data-arg-datepicker><i data-arg-icon="calendar-blank"></i></div></div>
              <div class="arg-field"><label class="arg-label" for="dp2">Đến ngày</label><div class="arg-control arg-datepicker__field"><input class="arg-input" id="dp2" type="text" value="29/10/2026" data-iso="2026-10-29" data-min="2026-10-26" data-max="2026-11-30" data-arg-datepicker><i data-arg-icon="calendar-blank"></i></div></div>
              <div class="arg-field"><label class="arg-label" for="dp3">Chưa chọn</label><div class="arg-control arg-datepicker__field"><input class="arg-input" id="dp3" type="text" placeholder="dd/mm/yyyy" data-arg-datepicker><i data-arg-icon="calendar-blank"></i></div></div>
            </div></div></div>
        </div>
      </section>
