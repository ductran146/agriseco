<section id="rating">
        <h2>Rating</h2>
        <p class="sec-desc">Nhãn một chữ cái cho khuyến nghị: B (nên bán), G (nên giữ), M (nên mua). Màu lấy từ token giao dịch. Chú thích dùng cỡ nhỏ, xếp một dòng.</p>
        <div class="demo">
          <div class="group"><h3>Nhãn <code>.arg-rating</code> · cỡ thường 32px và nhỏ <code>--sm</code> 20px</h3>
            <div class="row"><span class="arg-rating arg-rating--sell">B</span><span class="arg-rating arg-rating--hold">G</span><span class="arg-rating arg-rating--buy">M</span><span class="arg-rating arg-rating--sm arg-rating--sell">B</span><span class="arg-rating arg-rating--sm arg-rating--hold">G</span><span class="arg-rating arg-rating--sm arg-rating--buy">M</span></div></div>
          <div class="group"><h3>Chú thích <code>.arg-rating-legend</code></h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter)"><ul class="arg-rating-legend"><li><span class="arg-rating arg-rating--sm arg-rating--sell">B</span>Nên bán</li><li><span class="arg-rating arg-rating--sm arg-rating--hold">G</span>Nên giữ</li><li><span class="arg-rating arg-rating--sm arg-rating--buy">M</span>Nên mua</li></ul></div></div>
        </div>
      </section>
