<section id="selectsheet">
        <h2>Select sheet</h2>
        <p class="sec-desc">Ô chọn trông như Select nhưng bấm mở bảng trượt từ dưới lên liệt kê các lựa chọn, mỗi mục có tên và mô tả, mục đang chọn có dấu tròn. Dùng cho loại lệnh ở màn Giao dịch.</p>
        <div class="demo">
          <div class="group"><h3>Loại lệnh <code>.arg-selectsheet</code></h3>
            <div class="phone" style="padding:var(--arg-space-3x) var(--arg-gutter);min-height:520px"><div class="arg-control arg-select arg-select--center arg-selectsheet"><span class="arg-control__label">Loại lệnh</span><select class="arg-select-native" tabindex="-1" aria-hidden="true"><option>LO</option><option>MP</option><option>ATO</option><option>ATC</option></select><i data-arg-icon="caret-down"></i><button class="arg-selectsheet__hit" type="button" data-arg-open="ss-demo" data-label="Loại lệnh" aria-haspopup="dialog" aria-label="Loại lệnh, đang chọn LO"></button></div>
            <div class="arg-offcanvas-wrap" id="ss-demo" hidden data-arg-offcanvas data-arg-selectsheet><aside class="arg-offcanvas arg-offcanvas--bottom arg-offcanvas--auto" role="dialog" aria-modal="true" aria-labelledby="ss-demo-t"><div class="arg-modal__header"><h4 class="arg-modal__title" id="ss-demo-t">Loại lệnh</h4><button class="arg-icon-btn" type="button" data-arg-close aria-label="Đóng"><i data-arg-icon="x" class="i--20"></i></button></div><div class="arg-modal__body arg-optlist" role="radiogroup" aria-label="Loại lệnh"><button class="arg-optrow" type="button" role="radio" aria-checked="true" data-value="LO"><span class="arg-optrow__txt"><b>Lệnh giới hạn (LO)</b><span>Khớp tại mức giá đã chọn hoặc tốt hơn</span></span><span class="arg-optrow__tick"><i data-arg-icon="check"></i></span></button><button class="arg-optrow" type="button" role="radio" aria-checked="false" data-value="MP"><span class="arg-optrow__txt"><b>Lệnh thị trường (MP)</b><span>Khớp ngay tại giá thị trường tốt nhất hiện có</span></span><span class="arg-optrow__tick"><i data-arg-icon="check"></i></span></button><button class="arg-optrow" type="button" role="radio" aria-checked="false" data-value="ATO"><span class="arg-optrow__txt"><b>Lệnh xác định giá mở cửa (ATO)</b><span>Khớp tại giá có khối lượng khớp lớn nhất trong phiên xác định giá mở cửa</span></span><span class="arg-optrow__tick"><i data-arg-icon="check"></i></span></button><button class="arg-optrow" type="button" role="radio" aria-checked="false" data-value="ATC"><span class="arg-optrow__txt"><b>Lệnh xác định giá đóng cửa (ATC)</b><span>Khớp tại giá có khối lượng khớp lớn nhất trong phiên xác định giá đóng cửa</span></span><span class="arg-optrow__tick"><i data-arg-icon="check"></i></span></button></div></aside></div></div></div>
        </div>
      </section>
