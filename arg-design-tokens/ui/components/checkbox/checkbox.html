<section id="checkbox">
        <h2>Checkbox, Radio, Switch</h2>
        <p class="sec-desc">Dùng thẻ <code>&lt;input&gt;</code> gốc nằm trong <code>label.arg-check</code>. Phần hiển thị là <code>.box</code> hoặc <code>.track</code>. Trạng thái chọn dùng gradient nút chính.</p>
        <div class="demo">
          <div class="cols">
              <div class="stack">
                <label class="arg-check"><input type="checkbox" checked><span class="box"><i data-arg-icon="check"></i></span>Ghi nhớ đăng nhập</label>
                <label class="arg-check"><input type="checkbox"><span class="box"><i data-arg-icon="check"></i></span>Nhận thông báo qua email</label>
                <label class="arg-check"><input type="checkbox" disabled><span class="box"><i data-arg-icon="check"></i></span>Không khả dụng</label>
              </div>
              <div class="stack">
                <label class="arg-check"><input type="radio" name="ord" checked><span class="box"></span>Lệnh LO</label>
                <label class="arg-check"><input type="radio" name="ord"><span class="box"></span>Lệnh MP</label>
                <label class="arg-check"><input type="radio" name="ord" disabled><span class="box"></span>Lệnh ATC (đã đóng)</label>
              </div>
              <div class="stack">
                <label class="arg-check arg-switch"><input type="checkbox" role="switch" checked><span class="track"></span>Chế độ tối</label>
                <label class="arg-check arg-switch"><input type="checkbox" role="switch"><span class="track"></span>Xác nhận 2 lớp</label>
                <label class="arg-check arg-switch"><input type="checkbox" role="switch" disabled><span class="track"></span>Vô hiệu</label>
              </div>
            
          </div>
        </div>
      </section>
